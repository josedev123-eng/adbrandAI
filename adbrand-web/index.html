<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdBrand.AI · Anuncios con IA para tu negocio</title>
    <meta
      name="description"
      content="AdBrand.AI crea anuncios, kits de marca y calendarios de publicación con inteligencia artificial para pequeñas y medianas empresas del Perú."
    />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="color-scheme" content="light" />
    <!-- Seguridad: al salir a otro sitio solo se comparte el dominio, nunca la ruta completa -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:site_name" content="AdBrand.AI" />
    <meta property="og:title" content="AdBrand.AI · Anuncios con IA para tu negocio" />
    <meta
      property="og:description"
      content="Crea anuncios, tu kit de marca y tu calendario de publicaciones con IA, en minutos."
    />
    <meta name="twitter:card" content="summary" />

    <!-- Optimización: se abre la conexión con Google Fonts antes de pedir las letras -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

    <noscript>AdBrand.AI necesita JavaScript activado para funcionar.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
