spring.application.name=adbrand-core-api
spring.config.import=optional:file:.env[.properties]
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/adbrand
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Servidor de IA (los valores reales van en el .env, nunca en el código)
ia.base-url=${AI_BASE_URL:}
ia.api-key=${AI_API_KEY:}
ia.model=${AI_MODEL:}
ia.chat-path=${AI_CHAT_PATH:/api/chat/completions}
ia.timeout-seconds=${AI_TIMEOUT_SECONDS:60}
ia.mock=${AI_MOCK:true}
# Inicio de sesión del usuario PYME (HU 22). El valor por defecto es solo para desarrollo:
# en producción se pone JWT_SECRET con una frase larga y secreta (mínimo 32 caracteres).
jwt.secreto=${JWT_SECRET:solo-para-desarrollo-cambiar-en-produccion-adbrand-2026}
jwt.horas=${JWT_HORAS:8}
# Correos (HU 24). Con MAIL_MOCK=true solo se escriben en la consola; con false se envían por SMTP.
correo.mock=${MAIL_MOCK:true}
correo.remitente=${MAIL_FROM:no-responder@adbrand.ai}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
