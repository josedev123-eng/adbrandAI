spring.application.name=adbrand-core-api
spring.config.import=optional:file:.env[.properties]
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/adbrand
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Servidor de IA (los valores reales van en el .env, nunca en el código)
ia.base-url=${AI_BASE_URL:}
ia.api-key=${AI_API_KEY:}
ia.model=${AI_MODEL:}
ia.chat-path=${AI_CHAT_PATH:/api/chat/completions}
ia.timeout-seconds=${AI_TIMEOUT_SECONDS:60}
ia.mock=${AI_MOCK:true}
