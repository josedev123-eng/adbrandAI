spring.application.name=adbrand-core-api
spring.config.import=optional:file:.env[.properties]
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/adbrand
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Servidor de IA (los valores reales van en el .env, nunca en el código)
ia.base-url=${AI_BASE_URL:}
ia.api-key=${AI_API_KEY:}
ia.model=${AI_MODEL:}
ia.chat-path=${AI_CHAT_PATH:/api/chat/completions}
ia.timeout-seconds=${AI_TIMEOUT_SECONDS:60}
ia.mock=${AI_MOCK:true}
# IA de imágenes. Con AI_IMAGE_MOCK=true (por defecto) las imágenes son de prueba y no se gasta crédito.
# Cloudflare Workers AI (gratis) hace los borradores; OpenRouter (prepago) la versión final y los retoques.
ia.imagen.mock=${AI_IMAGE_MOCK:true}
ia.imagen.cloudflare-account-id=${CF_ACCOUNT_ID:}
ia.imagen.cloudflare-token=${CF_API_TOKEN:}
ia.imagen.modelo-borrador=${CF_IMAGE_MODEL:@cf/black-forest-labs/flux-1-schnell}
ia.imagen.openrouter-api-key=${AI_IMAGE_API_KEY:}
ia.imagen.modelo-final=${AI_IMAGE_MODEL:google/gemini-2.5-flash-image}
ia.imagen.timeout-seconds=${AI_IMAGE_TIMEOUT_SECONDS:90}
# Control de gasto: retoques reales (de pago) que puede hacer cada empresa por mes.
ia.imagen.limite-retoques-mes=${AI_IMAGE_RETOUCH_LIMIT:20}
# Pago con tarjeta por Mercado Pago (HU 26). Sin llaves se usa la pasarela simulada.
# Solo credenciales de prueba (pestaña "Prueba" del panel): nunca se cobra dinero real.
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.public-key=${MP_PUBLIC_KEY:}
mercadopago.timeout-seconds=${MP_TIMEOUT_SECONDS:30}
# "orders" (API nueva, por defecto) o "payments": el mismo "Tipo de API" elegido al crear la app.
mercadopago.api=${MP_API:orders}
# Inicio de sesión del usuario PYME (HU 22). El valor por defecto es solo para desarrollo:
# en producción se pone JWT_SECRET con una frase larga y secreta (mínimo 32 caracteres).
jwt.secreto=${JWT_SECRET:solo-para-desarrollo-cambiar-en-produccion-adbrand-2026}
jwt.horas=${JWT_HORAS:8}
# HU 43: días que dura el token de renovación de la app móvil.
jwt.renovacion.dias=${JWT_RENOVACION_DIAS:30}
# V18 se agregó después de que la base local ya tenía V20-V37. En bases nuevas se aplica en orden.
spring.flyway.out-of-order=true
# Correos (HU 24). Con MAIL_MOCK=true solo se escriben en la consola; con false se envían por SMTP.
correo.mock=${MAIL_MOCK:true}
correo.remitente=${MAIL_FROM:no-responder@adbrand.ai}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
