# Integración continua de AdBrand.AI: en cada push y en cada pull request a main,
# GitHub corre las pruebas de las 5 partes del proyecto en paralelo.
# Todo corre en modo simulado (IA, imágenes, correo y pagos): no necesita ninguna clave secreta.
name: Pruebas

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Si llega otro push a la misma rama, se cancela la corrida anterior (ahorra minutos).
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-api:
    name: Backend del usuario (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Base de datos de prueba. Flyway crea todas las tablas al arrancar las pruebas.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: adbrand
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_PASSWORD: postgres
    defaults:
      run:
        working-directory: adbrand-core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Correr las pruebas
        run: bash ./mvnw -B test

  admin-api:
    name: Backend del administrador (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: adbrand
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_PASSWORD: postgres
    defaults:
      run:
        working-directory: adbrand-admin-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: adbrand-admin-api/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Correr las pruebas
        run: python manage.py test

  web-usuario:
    name: Web del usuario (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adbrand-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: adbrand-web/package-lock.json
      - run: npm ci
      - name: Revisar el código (lint)
        run: npm run lint
      - name: Correr las pruebas
        run: npm test
      - name: Compilar
        run: npm run build

  web-admin:
    name: Panel del administrador (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adbrand-admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: adbrand-admin-web/package-lock.json
      - run: npm ci
      - name: Revisar el código (lint)
        run: npm run lint
      - name: Correr las pruebas
        run: npm test
      - name: Compilar
        run: npm run build

  movil:
    name: App móvil (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: adbrand-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Correr las pruebas
        run: bash ./gradlew testDebugUnitTest --console=plain
